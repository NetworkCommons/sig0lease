# DNS Proxy Configuration Example
#
# This file demonstrates the configuration options for the DNS proxy.
# The proxy routes DNS queries based on their opcode to processing modules,
# and forwards all other opcodes to upstream resolvers.
#
# Protocol-Specific Routing:
# - UPDATE queries WITH UPDATE-LEASE EDNS option (RFC 9664) are handled by the update handler
# - UPDATE queries WITHOUT UPDATE-LEASE EDNS option are forwarded to the default upstream resolver
# - Other opcodes are routed according to the configured processing rules or forwarded upstream

server:
  # Address to listen on (port 8053 by default - non-privileged)
  # For standard DNS, use :53 but requires root privileges
  address: ":8053"

  # Networks to enable
  networks:
    - udp
    - tcp
    # - tls   # DNS-over-TLS (RFC 7858); requires the "tls:" block below

  # DNS-over-TLS listener config -- only read if "tls" appears in networks above.
  # Its own address (conventionally 853, separate from plain DNS on the address above);
  # opportunistic TLS only, no client-certificate authentication. Transport-level, so it
  # benefits every handler (update_handler and srp_handler alike), not protocol-specific.
  # tls:
  #   address: ":853"
  #   cert: "/path/to/cert.pem"
  #   key: "/path/to/key.pem"

upstreams:
  # Generic upstream resolvers used for non-processed opcodes.
  # Forwarding for opcodes not listed in processing_rules uses the upstreams list.
  # UPDATE handlers primarily resolves authoritative server from handlers.<handler>.upstream_zone.
  - address: "8.8.8.8:53"
    protocol: "udp"
    timeout: "5s"

  # Secondary upstream resolver (used as fallback)
  - address: "8.8.4.4:53"
    protocol: "udp"
    timeout: "5s"

# Processing rules map opcodes to an ORDERED list of module names. The router tries
# each module in turn until one returns "processed" or "error"; if every one declines
# ("not relevant" -- e.g. an SRP-shaped update handled by srp_handler, or a plain UPDATE
# without the UPDATE-LEASE option handled by update_handler), the opcode falls through to
# plain upstream forwarding.
processing_rules:
  # Route opcode 5 (UPDATE) to the update handler module.
  # UPDATE queries are used for dynamic DNS updates (RFC 2136).
  #
  # To also enable RFC 9665 SRP on a *different* zone from the same proxy process, add
  # srp_handler ahead of update_handler and configure handlers.srp_handler below (one
  # zone, one protocol -- don't point both handlers' upstream_zone at the same
  # zone):
  #   modules: ["srp_handler", "update_handler"]
  - opcode: 5
    # modules: ["update_handler"]
    modules: ["srp_handler", "update_handler"]


# Handler Configuration for SIG(0) Registration Requests
# Proxy acts as intermediary between downstream client and upstream authoritative server
handlers:
  # handlers.srp_handler: RFC 9665 SRP config (only read if "srp_handler" appears in
  # processing_rules above). Same shape as handlers.update, plus:
  #   upstream:                     static "host:port" override, skips SOA/NS discovery
  #   allow_udp:                    permit UDP for this zone (default false -- TCP required)
  #   refuse_on_foreign_data:       REFUSED when a name exists upstream with data but no KEY
  #                                 (default true)
  #   rewrite_default_service_arpa: accept default.service.arpa. (every real SRP client
  #                                 hardcodes it, having no other way to discover a zone) as
  #                                 an alias for upstream_zone, rewriting every name in the
  #                                 update before anything else sees it (default false)
  #   advertise_registration_domain: also publish the RFC 6763 S11 "r"/"dr" registration-
  #                                 domain records (self-pointing at upstream_zone), independent
  #                                 of whether any service type is currently live -- unlike the
  #                                 always-on "b"/"db"/"lb" browsing-domain records, which only
  #                                 appear once at least one service type is live. Off by
  #                                 default -- advertising this zone as an open target for
  #                                 direct RFC 2136 registration (not just SRP) is a deployment
  #                                 choice.
  srp_handler:
    upstream_zone: "srp.dev.zenr.io."
    keystore_dir: "./keystore/server"
    rewrite_default_service_arpa: true
    # advertise_registration_domain: false
    lease_policy:
      min_key_lease_sec: 30
      max_key_lease_sec: 1209600   # RFC 9665's usual 14-day KEY-LEASE
      min_rr_lease_sec: 30
      max_rr_lease_sec: 7200

    # Lease storage backend -- same "storage"/"lease_manager" option as handlers.update below
    # (both go through the identical file-backed LeaseStorage implementation, pkg/lease's
    # FileLeaseStore -- neither handler gets special treatment). Optional; when omitted,
    # leases are kept in-memory only and are lost on a crash or restart, silently -- there is
    # no warning at startup if this is left unset. Must NOT reuse handlers.update's own path:
    # these are two independent lease-store instances (different zones, different tree
    # shapes), and pointing both at the same file would have each one clobber the other's
    # snapshot on save.
    storage:
      type: file
      path: "./data/srp_lease_snapshot.json"   # required for type: file
      save_interval: "30s"                      # optional, default 30s
  update:
    # Upstream zone used to discover authoritative nameserver for UPDATE forwarding.
    # Proxy resolves NS for this zone and sends UPDATE to that authoritative server.
    upstream_zone: "dev.zenr.io."

    # Keystore directory containing DNSSEC keys in sig0namectl format
    keystore_dir: "./keystore/server"

    # Optional Lease rewrite policy applied before forwarding UPDATE to upstream.
    # KEY and non-KEY records are clamped separately.
    # RFC 9464:
    # Default values for upper limits of 24 hours and 7 days, respectively,
    # are RECOMMENDED.
    # Servers implementing Update Lease MUST have a default minimum lease duration.
    # A minimum of 30 seconds for both the LEASE and KEY-LEASE durations is RECOMMENDED.
    lease_policy:
      min_key_lease_sec: 30
      max_key_lease_sec: 1800
      min_rr_lease_sec: 30
      max_rr_lease_sec: 900

    # Whether to use 4-byte variant for lease requests (backward compatibility).
    # Default is false: 8-byte variant is always used for ALL lease requests.
    # When true, refresh requests use 4-byte variant (no KEY-LEASE).
    # When false, all requests use 8-byte variant (KEY-LEASE=0 for refresh/no second RR).
    prefer_4byte_variant: false

    # Blacklisted RR types that are not allowed for registration.
    # These types will be rejected with a format error if attempted.
    # Entries are RR type names as defined by IANA (case-insensitive).
    # Commonly blacklisted types: NULL (unknown types), NXNAME.
    blacklisted_types:
      - "NULL"
      - "NXNAME"
      - "CLA"
      - "IPN"

    # Lease storage backend. Optional; when omitted, leases are kept
    # in-memory only and are lost on restart.

    # storage:
    #   type: memory

    storage:
      # To persist leases across restarts, use a file-backed store instead:
      type: file
      path: "./data/lease_snapshot.json"   # required for type: file
      save_interval: "30s"                  # optional, default 30s

