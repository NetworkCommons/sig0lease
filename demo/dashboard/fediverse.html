<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fediverse Dashboard</title>
    <link rel="icon" href="icons/fedi/fediverse.svg" type="image/svg+xml"/>
    <link rel="stylesheet" href="fediverse.css"/>
    <link href="fontawesome/css/fontawesome.min.css" rel="stylesheet" />
    <link href="fontawesome/css/solid.min.css" rel="stylesheet" />
    <link href="fontawesome/css/brands.min.css" rel="stylesheet" />
    <script src="wasm_exec.js"></script>
    <script src="sig0.js"></script>
    <script src="dns.js"></script>
    <script src="services.js"></script>
    <script src="fediverse.js"></script>
    <script>
        const DEFAULT_ZONE = 'srp.dev.zenr.io'
        // DNS-over-HTTPS server of the sig0lease proxy, which answers its
        // zones from their authoritative server: `?doh=<url>`, by default
        // the origin the dashboard is served from (as on the registrar)
        const DOH = new URLSearchParams(location.search).get('doh')
        // when no `?doh=` is given and the origin is no DoH server (a static
        // web server, a file:// page): the sig0lease proxies asked for a zone
        // that is, or is under, `domain`, if they answer DoH ...
        const ZONE_DOH = [
            {domain: 'zenr.io', doh: 'https://sig0lease.dev.zenr.io'},
        ]
        // ... and else a public resolver, whose answers may be cached
        const PUBLIC_DOH = 'https://1.1.1.1'
        // the instances of icons/instances.md that the zone does not have
        // yet are registered for 5 minutes when the page loads, unless
        // `?seed=0`; at the SRP registrar `?registrar=<url>`, by default
        // the zone's DoH server
        const SEED = new URLSearchParams(location.search).get('seed') !== '0'
        const REGISTRAR = new URLSearchParams(location.search).get('registrar')
        let dashboard = null

        /// zone from the URL hash, or the default zone
        function initial_zone() {
            const hash = decodeURIComponent(location.hash.slice(1))
            return hash || DEFAULT_ZONE
        }

        // start the dashboard when WASM is ready
        window.addEventListener('wasm_ready', function(){
            console.log('WASM is ready')
            dashboard = new FediverseDashboard(DOH, ZONE_DOH, PUBLIC_DOH, SEED, REGISTRAR)
            dashboard.set_zone(document.getElementById('zone').value)
        })

        window.addEventListener('wasm_failed', function(event){
            document.getElementById('status').dataset.state = 'error'
            document.getElementById('status-text').textContent =
                'WASM did not load: ' + event.detail.message
        })

        window.addEventListener('DOMContentLoaded', function(){
            document.getElementById('zone').value = initial_zone()
        })

        window.addEventListener('hashchange', function(){
            const zone = initial_zone()
            document.getElementById('zone').value = zone
            if (dashboard) {
                dashboard.set_zone(zone)
            }
        })

        /// submit a zone for display
        function submit_zone(event, form) {
            event.preventDefault()
            const zone = form.zone.value.trim().replace(/\.$/, '').toLowerCase()
            form.zone.value = zone
            history.replaceState(null, '', '#' + zone)
            if (dashboard) {
                dashboard.set_zone(zone)
            }
        }
    </script>
</head>
<body>
    <header>
        <div class="bar">
            <h1><img class="logo" src="icons/fedi/fediverse.svg" alt=""/> Fediverse Dashboard</h1>
            <form onsubmit="submit_zone(event, this);" class="zone-form">
                <label for="zone">Zone</label>
                <input type="text"
                    id="zone"
                    name="zone"
                    placeholder="e.g. srp.dev.zenr.io"
                    required
                    minlength="4"
                    maxlength="253"
                    pattern="[A-Za-z0-9._\-]{4,253}\.?"
                    spellcheck="false"
                    autocomplete="off"
                    />
                <button type="submit" title="show the fediverse services of this zone"><span class="fa-solid fa-magnifying-glass"></span> Show</button>
            </form>
        </div>
        <div id="status" data-state="loading">
            <span class="dot"></span>
            <span id="status-text">Loading WASM …</span>
            <span id="seed" hidden></span>
            <span id="dnssec" title="zone is DNSSEC signed" hidden><span class="fa-solid fa-shield-halved"></span> DNSSEC</span>
        </div>
    </header>

    <main>
        <div id="boxes"></div>
        <p id="empty" hidden>No fediverse services (<code>_fedi._tcp</code>) are registered under this zone.</p>
    </main>

    <!-- Templates -->
    <template id="box-template">
        <section class="box">
            <div class="title">
                <span class="service-icon"></span>
                <div class="heading">
                    <h2 class="name"></h2>
                    <div class="type">
                        <span class="subtype"></span>
                        <span class="service"></span>
                    </div>
                </div>
                <span class="count" title="registered instances"></span>
            </div>
            <div class="fqdn"></div>
            <ul class="entries"></ul>
        </section>
    </template>
    <template id="entry-template">
        <li class="entry">
            <div class="label"></div>
            <a class="link" href="" target="_blank" rel="noopener noreferrer" hidden>
                <span class="icon"></span>
                <span class="url"></span>
            </a>
            <div class="targets"></div>
            <div class="txt"></div>
        </li>
    </template>
</body>
</html>
