<!doctype html>
<!-- D5's page (docs/demo.md), served by each XMPP server demo/chat.sh runs: Converse.js logs in
     as a guest of that server and joins the room.
     ?domain= the server's XMPP domain; default, the name the page was opened by. demo/chat.sh
              gives it in the address it prints, for phones that cannot use the name.
     ?room=   the room to join; default meet@rooms.<domain>. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/converse.js@14.0.1/dist/converse.min.css">
<!-- Converse.js 14 is built only as an ES module: as a classic script it does not parse, and
     converse stays undefined. Module scripts run in document order, so the one below finds
     window.converse, which this one sets. -->
<script type="module" src="https://cdn.jsdelivr.net/npm/converse.js@14.0.1/dist/converse.min.js"></script>
</head>
<body>
<script type="module">
const params = new URLSearchParams(location.search);
const domain = params.get('domain') || location.hostname;

// Each guest login is a new address, so a page opened again (a reload, or a phone that dropped
// the tab) is a new guest, which cannot resume the old one's session. The page makes it the same
// person in the room:
// - The page keeps the nickname the guest chose, in this browser, and joins with it next time.
// - When the page goes, the page closes its session (unavailable presence, then the stream's close),
//   so the server frees the nickname at once. Converse leaves a resumable session open instead,
//   which would hold the nickname until the server gives up on it (smacks_hibernation_time in
//   prosody.cfg.lua). A page the browser restores from its cache has no session any more, and
//   loads again.
// The room's conversation comes from its archive (muc_mam in prosody.cfg.lua).
const nickname = 'd5-nickname';
const keepNickname = (muc) => localStorage.setItem(nickname, muc.get('nick'));
converse.plugins.add('d5-guest', {
    initialize() {
        const { api } = this._converse;
        api.listen.on('getNicknameForMUC', (muc, nick) => nick || localStorage.getItem(nickname));
        // After a reconnection, Converse enters the same room model again: the page adds its
        // listener once.
        api.listen.on('enteredNewRoom', (muc) => {
            keepNickname(muc);
            muc.off('change:nick', keepNickname);
            muc.on('change:nick', keepNickname);
        });
        window.addEventListener('pagehide', () => api.connection.get()?.disconnect('the page closed'));
        window.addEventListener('pageshow', (event) => { if (event.persisted) location.reload(); });
    },
});

converse.initialize({
    whitelisted_plugins: ['d5-guest'],
    authentication: 'anonymous',
    jid: domain,
    auto_login: true,
    websocket_url: `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/xmpp-websocket`,
    discover_connection_methods: false,
    auto_join_rooms: [params.get('room') || `meet@rooms.${domain}`],
    view_mode: 'fullscreen',
    // The room's conversation, from its archive, also while the page asks a new guest for a
    // nickname. Converse reads the archive of a room that has one on joining, and then asks for
    // none of the history the room keeps in memory (muc_history_max_stanzas).
    muc_show_logs_before_join: true,
    // Opened over plain HTTP at a LAN address, the page is not a secure context, so the browser
    // gives it no Web Crypto (crypto.subtle). converse-caps hashes every presence with it, and
    // without it the room's join presence is never sent; converse-omemo cannot start without it.
    blacklisted_plugins: ['converse-caps', 'converse-omemo'],
});
</script>
</body>
</html>
