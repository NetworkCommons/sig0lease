# What every instance needs on the registrar before a release: dig for the checks, the user that
# runs the proxies, the directories, the zones' keys and the service, sig0lease@<instance>.

- name: Install dig, for the checks
  ansible.builtin.apt:
    name: bind9-dnsutils
    state: present

- name: Add the sig0lease user, who runs the proxies
  ansible.builtin.user:
    name: sig0lease
    system: true
    shell: /usr/sbin/nologin
    home: "{{ sig0lease_state_root }}"
    create_home: false

- name: Make the directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ sig0lease_root }}/releases", owner: root, mode: "0755"}
    - {path: "{{ sig0lease_etc }}", owner: root, mode: "0755"}
    - {path: "{{ sig0lease_etc }}/keystore", owner: sig0lease, mode: "0700"}
    - {path: "{{ sig0lease_state_root }}", owner: root, mode: "0755"}
    - {path: "{{ sig0lease_state }}", owner: sig0lease, mode: "0700"}
  loop_control:
    label: "{{ item.path }}"

- name: Copy the zones' keys, from keystore/server on this machine
  ansible.builtin.copy:
    src: "{{ sig0lease_repo }}/keystore/server/"
    dest: "{{ sig0lease_etc }}/keystore/"
    owner: sig0lease
    group: sig0lease
    mode: "0600"
    directory_mode: "0700"

- name: Install the service, one per instance
  ansible.builtin.template:
    src: sig0lease@.service.j2
    dest: /etc/systemd/system/sig0lease@.service
    mode: "0644"
