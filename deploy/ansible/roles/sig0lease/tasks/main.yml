# make deploy: the proxy, as a release built on this machine from the checkout (build.yml), copied
# into the instance's releases/ beside the ones before it (staging's, as site.yml allows no
# other), and made the one the instance runs (activate.yml): sig0lease@<instance>.service runs it
# from current, a link to it. A release that fails its checks is replaced by the one before it.
# When the instance already runs the same files, and nothing it starts with changed since it
# started (compare.yml), nothing is installed.

- name: Build the release on this machine
  ansible.builtin.import_tasks: build.yml

- name: Prepare the registrar
  ansible.builtin.import_tasks: prepare.yml

- name: Compare the release with the one the instance runs
  ansible.builtin.import_tasks: compare.yml
  vars:
    sig0lease_source_host: localhost
    sig0lease_source_dir: "{{ sig0lease_build_dir }}"

- name: Install the release, unless the instance runs the same
  when: not sig0lease_unchanged | bool
  block:
    - name: Make the release's directory
      ansible.builtin.file:
        path: "{{ sig0lease_root }}/releases/{{ sig0lease_release }}"
        state: directory
        mode: "0755"

    - name: Copy the proxy, the agent and config.base.yaml
      ansible.builtin.copy:
        src: "{{ sig0lease_build_dir }}/{{ item.name }}"
        dest: "{{ sig0lease_root }}/releases/{{ sig0lease_release }}/{{ item.name }}"
        mode: "{{ item.mode }}"
      loop:
        - {name: sig0lease, mode: "0755"}
        - {name: sig0lease-agent, mode: "0755"}
        - {name: config.base.yaml, mode: "0644"}
      loop_control:
        label: "{{ item.name }}"

    - name: Copy the page
      ansible.builtin.copy:
        src: "{{ sig0lease_build_dir }}/web/"
        dest: "{{ sig0lease_root }}/releases/{{ sig0lease_release }}/web/"
        mode: "0644"
        directory_mode: "0755"

    - name: Make it the release the instance runs
      ansible.builtin.import_tasks: activate.yml

- name: Remove the build on this machine
  ansible.builtin.file:
    path: "{{ sig0lease_build_dir }}"
    state: absent
  delegate_to: localhost
  run_once: true
