# The instance's community node (deploy/README.md, "The community node"), for an instance that has
# one: kubo, its user and repository, the private swarm's key, the node's config, and the node
# started; the agent's user, keystore, swarm key, template and service, which the release's
# activation starts (agent.yml), as the agent is part of the release. Runs before the sig0lease
# role, so that a release finds everything its agent needs.

- name: The instance's swarm key is on this machine
  ansible.builtin.assert:
    that: >-
      lookup('ansible.builtin.file', community_swarm_key, errors='ignore') | default('', true) | string
      is match('/key/swarm/psk/1[.]0[.]0/\n/base16/\n[0-9a-f]{64}$')
    fail_msg: >-
      {{ community_swarm_key }} is not the private swarm key of {{ registrar_instance }}'s community
      node: make it once, and give it to the members (deploy/README.md, "The community node").
    quiet: true

- name: Install curl, for the checks
  ansible.builtin.apt:
    name: curl
    state: present

- name: Make kubo's directory
  ansible.builtin.file:
    path: "{{ community_kubo_dir }}"
    state: directory
    mode: "0755"

- name: Download kubo {{ community_kubo_version }}
  ansible.builtin.get_url:
    url: "https://github.com/ipfs/kubo/releases/download/{{ community_kubo_version }}/kubo_{{ community_kubo_version }}_linux-{{ community_arch }}.tar.gz"
    dest: "{{ community_kubo_dir }}/kubo.tar.gz"
    checksum: "sha512:{{ community_kubo_sha512[community_arch] }}"
    mode: "0644"
  vars:
    community_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }}"

- name: Unpack it
  ansible.builtin.unarchive:
    src: "{{ community_kubo_dir }}/kubo.tar.gz"
    dest: "{{ community_kubo_dir }}"
    remote_src: true
    creates: "{{ community_kubo_bin }}"

- name: Add the users who run the node and the agent of {{ registrar_instance }}
  ansible.builtin.user:
    name: "{{ item.name }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ item.home }}"
    create_home: false
  loop:
    - {name: "{{ community_kubo_user }}", home: "{{ community_kubo_repo }}"}
    - {name: "{{ community_agent_user }}", home: "{{ community_agent_keystore }}"}
  loop_control:
    label: "{{ item.name }}"

- name: Make the directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ community_kubo_repo | dirname }}", owner: root, mode: "0755"}
    - {path: "{{ community_kubo_repo }}", owner: "{{ community_kubo_user }}", mode: "0700"}
    - {path: "{{ community_agent_keystore | dirname }}", owner: root, mode: "0755"}
    - {path: "{{ community_agent_keystore }}", owner: "{{ community_agent_user }}", mode: "0700"}
    - {path: "{{ community_agent_template | dirname | dirname }}", owner: root, mode: "0755"}
    - {path: "{{ community_agent_template | dirname }}", owner: root, mode: "0755"}
  loop_control:
    label: "{{ item.path }}"

- name: Make the node's repository, once
  ansible.builtin.command:
    argv: [runuser, -u, "{{ community_kubo_user }}", --, env, "IPFS_PATH={{ community_kubo_repo }}",
           "{{ community_kubo_bin }}", init, --profile, "server,autoconf-off"]
    creates: "{{ community_kubo_repo }}/config"

- name: Copy the private swarm's key
  ansible.builtin.copy:
    src: "{{ community_swarm_key }}"
    dest: "{{ community_kubo_repo }}/swarm.key"
    owner: "{{ community_kubo_user }}"
    group: "{{ community_kubo_user }}"
    mode: "0600"
  notify: Restart the community node

# The agent reads it at each check: a new key needs no restart.
- name: Copy it for the agent, which checks the members' swarm-mac= with it
  ansible.builtin.copy:
    src: "{{ community_swarm_key }}"
    dest: "{{ community_agent_swarm_key }}"
    owner: "{{ community_agent_user }}"
    group: "{{ community_agent_user }}"
    mode: "0400"

- name: Read the node's config
  ansible.builtin.slurp:
    src: "{{ community_kubo_repo }}/config"
  register: community_kubo_config

- name: Write the instance's changes into it
  ansible.builtin.copy:
    content: "{{ community_kubo_config.content | b64decode | from_json | combine(community_kubo_overrides, recursive=true) | to_nice_json(indent=2) }}\n"
    dest: "{{ community_kubo_repo }}/config"
    owner: "{{ community_kubo_user }}"
    group: "{{ community_kubo_user }}"
    mode: "0600"
  notify: Restart the community node

- name: Write the agent's template
  ansible.builtin.template:
    src: community.yaml.j2
    dest: "{{ community_agent_template }}"
    mode: "0644"

- name: Install the node's service, one per instance
  ansible.builtin.template:
    src: kubo@.service.j2
    dest: "{{ community_kubo_unit }}"
    mode: "0644"
  notify: Restart the community node

# A changed template or unit restarts the agent with the release (sig0lease role, compare.yml).
- name: Install the agent's service, one per instance
  ansible.builtin.template:
    src: sig0lease-agent@.service.j2
    dest: "{{ community_agent_unit }}"
    mode: "0644"

- name: Start the node, and start it at boot
  ansible.builtin.systemd_service:
    name: "{{ community_kubo_service }}"
    state: started
    enabled: true
    daemon_reload: true

- name: Restart the node now if anything it starts with changed
  ansible.builtin.meta: flush_handlers
